name: Promote published release to -latest pointer

# 사람이 devvault-v* Draft 릴리스를 Publish하는 순간, 그 버전의 자산을
# 자동 업데이트 endpoint가 바라보는 고정 릴리스(<product>-latest)로 복제한다.
# → "Publish 클릭" 하나가 게이트이고, latest.json 포인터 갱신은 자동.
#
# 트리거가 둘이다(2026-09-18, 소스 레포 docs/tracks/platform/2026-09-14-promote-pointer-race).
#  - release: published — 게시 순간 한 번 운다. 손으로 게시한 릴리스와 dispatch 경로가 죽었을
#    때의 안전망으로 **남긴다.** 다만 tauri-action은 첫 매트릭스 칸이 게시하므로 이때의
#    latest.json은 반쪽일 수 있다(v0.12.0에서 Windows만 실린 포인터가 초록으로 나갔다).
#  - workflow_dispatch — 소스 레포 release.yml이 **모든 빌드가 끝난 뒤** 부른다. 이번 실행이
#    실제로 낸 플랫폼을 expected_platforms로 넘기고, latest.json이 그것을 다 덮지 못하면
#    포인터를 건드리지 않고 선다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '포인터로 올릴 버전 태그 (예: ekaya-studio-v0.13.0)'
        required: true
        type: string
      expected_platforms:
        description: '이 릴리스가 낸 빌드 플랫폼 JSON 배열 (예: ["windows","linux"]). 비우면 대조하지 않는다.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# 같은 태그의 두 경로(published·dispatch)가 한 줄로 서도록 키를 맞춘다. 완주 뒤에 오는 dispatch가
# 반드시 나중에 쓰므로, 게시 순간의 반쪽 포인터가 완전한 포인터를 덮지 못한다.
concurrency:
  group: promote-latest-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    # 포인터 릴리스(<product>-latest) 자신이 publish될 때 재귀 실행되는 것을 막는다.
    # (추가 안전장치: GITHUB_TOKEN으로 만든 릴리스는 애초에 workflow를 재트리거하지 않음)
    # dispatch 경로에서는 release.tag_name이 비어 있으므로 입력 태그로 본다.
    if: ${{ !endsWith(github.event.release.tag_name || inputs.tag, '-latest') }}
    runs-on: ubuntu-latest
    # 자산 완주를 최대 30분 기다린다. 기본 타임아웃(6시간)에 걸려 러너를 오래 붙들지 않도록 조인다.
    timeout-minutes: 40
    steps:
      # gh release 하위명령이 대상 레포를 git 원격에서 추론하므로 checkout이 필요하다.
      # (GH_REPO 만으로는 gh가 여전히 git 컨텍스트를 찾다 "not a git repository"로 실패)
      - uses: actions/checkout@v4
      - name: Sync published version assets onto <product>-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EXPECTED: ${{ inputs.expected_platforms }}
        run: |
          set -euo pipefail

          # 버전 태그(<product>-v<semver>)만 처리한다. 그 외 태그는 무시.
          case "$TAG" in
            *-v*) : ;;
            *) echo "skip: '$TAG' 은 버전 태그가 아님"; exit 0 ;;
          esac

          product="${TAG%-v*}"          # devvault-v0.2.0 -> devvault
          latest_tag="${product}-latest"
          workdir="$(mktemp -d)"

          echo "promote: $TAG -> $latest_tag"

          # ── 자산 완주 대기 ─────────────────────────────────────────────────
          # Publish 이벤트는 "사람이 Publish를 누른" 순간 오지만, 플랫폼별 빌드 잡은 그 뒤에도
          # 계속 자산을 올린다. 2026-08-24 v0.10.0에서 Windows setup.exe와 latest.json이
          # Publish보다 14분 늦게 도착해, promote가 .deb 두 개만 담은 포인터를 만들고 "success"로
          # 끝냈다 → endpoint의 latest.json이 사라져 모든 클라이언트의 업데이트 확인이 404로 죽었다.
          # 그래서 latest.json이 나타날 때까지 기다리고, 그것이 가리키는 설치본과 서명이 전부
          # 릴리스에 올라왔는지 확인한 뒤에만 포인터를 만든다.
          ready=0
          for i in $(seq 1 60); do            # 30초 × 60 = 최대 30분
            names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

            if ! printf '%s\n' "$names" | grep -qx 'latest.json'; then
              echo "wait($i/60): latest.json 아직 없음"
              sleep 30; continue
            fi

            # latest.json이 가리키는 파일이 전부 있는지 대조한다. 서명(.sig)까지 보는 이유는
            # "설치본은 왔는데 서명이 아직인" 반쪽 상태로 포인터를 만들면 업데이터가 검증에서
            # 실패하기 때문이다.
            rm -f "$workdir/latest.json"
            gh release download "$TAG" --dir "$workdir" --pattern 'latest.json'
            missing=''
            for f in $(jq -r '.platforms[].url' "$workdir/latest.json" | xargs -n1 basename | sort -u); do
              printf '%s\n' "$names" | grep -qx "$f"     || missing="$missing $f"
              printf '%s\n' "$names" | grep -qx "$f.sig" || missing="$missing $f.sig"
            done
            if [ -n "$missing" ]; then
              echo "wait($i/60): latest.json이 가리키는 자산 누락 -$missing"
              sleep 30; continue
            fi

            echo 'ok: 자산 완주 확인'
            ready=1; break
          done
          if [ "$ready" != '1' ]; then
            echo '::error::30분 안에 자산이 완주하지 않아 포인터를 갱신하지 않았습니다.'
            echo '::error::기존 포인터는 건드리지 않았습니다. 빌드가 모두 끝난 뒤 이 실행을 Re-run 하세요.'
            exit 1
          fi

          # ── 기대값 대조 (dispatch 경로) ────────────────────────────────────
          # 위 대기는 「latest.json이 가리키는 파일」만 기다린다. latest.json 자체가 반쪽이면 기다릴
          # 목록도 반쪽이라 그대로 통과한다 — 조용한 성공. 그래서 이번 릴리스가 **낸 플랫폼**과 대조한다.
          # 기대값이 없으면(published 경로) 예전 동작 그대로 간다 — 손으로 게시한 릴리스가 여기서 서면 안 된다.
          #
          # 이름 층이 둘이다. 넘어오는 것은 빌드 플랫폼(windows·linux·macos)이고 latest.json의 키는
          # 업데이터 타깃(windows-x86_64-nsis, linux-x86_64-deb, darwin-aarch64 …)이다. 1:1이 아니라서
          # 접두로 대조하되, macOS만 키가 darwin-으로 시작하므로 한 번 옮긴다.
          # 모자라면 **포인터를 건드리기 전에** 선다(지운 뒤에 서면 endpoint가 404가 된다).
          if [ -n "${EXPECTED:-}" ]; then
            keys="$(jq -r '.platforms | keys[]' "$workdir/latest.json")"
            want="$(jq -r '.[]' <<<"$EXPECTED")"
            n_want=0; lacking=''
            for p in $want; do
              n_want=$((n_want + 1))
              case "$p" in
                macos) prefix='darwin-' ;;
                *)     prefix="$p-" ;;
              esac
              printf '%s\n' "$keys" | grep -q "^$prefix" || lacking="$lacking $p"
            done
            n_keys="$(printf '%s\n' "$keys" | grep -c . || true)"
            echo "기대 플랫폼 ${n_want}개($(echo $want)) / latest.json 키 ${n_keys}개($(echo $keys))"
            if [ -n "$lacking" ]; then
              echo "::error::latest.json에 빠진 플랫폼:$lacking — 기대 ${n_want}개 중 일부가 실리지 않았습니다."
              echo '::error::기존 포인터는 건드리지 않았습니다. 빠진 플랫폼의 빌드를 확인한 뒤 다시 실행하세요.'
              exit 1
            fi
            echo 'ok: 기대 플랫폼이 latest.json에 전부 실렸다'
          fi

          # 발행된 버전 릴리스의 모든 자산(설치본 + latest.json + 서명)을 내려받는다.
          gh release download "$TAG" --dir "$workdir" --clobber

          # 기존 포인터 릴리스와 태그를 제거하고, 새 자산으로 재생성한다.
          gh release delete "$latest_tag" --yes --cleanup-tag || true
          gh release create "$latest_tag" "$workdir"/* \
            --title "${product} latest (auto-update pointer -> ${TAG})" \
            --notes "자동 업데이트 endpoint 전용 고정 릴리스입니다. 배포 노트는 ${TAG} 릴리스를 참고하세요."

          echo "done: $latest_tag 가 $TAG 자산으로 갱신됨"

          # 포인터가 실제로 쓸 수 있는 상태인지 마지막에 한 번 더 확인한다(조용한 성공 금지).
          for f in latest.json; do
            gh release view "$latest_tag" --json assets --jq '.assets[].name' | grep -qx "$f" \
              || { echo "::error::포인터에 $f 가 없습니다 — endpoint가 404가 됩니다."; exit 1; }
          done
